services:
  - type: web
    name: realty-event-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: WEBAPP_HOST
        value: 0.0.0.0
      - key: WEBAPP_PORT
        value: 10000
      - key: WEBHOOK_PATH
        value: /telegram/webhook
